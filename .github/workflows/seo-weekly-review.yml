name: SEO weekly review

# Monday 11:00 UTC (7:00am ET). Pulls a fresh snapshot, diffs it against last week,
# fixes mechanical SEO issues, merges any article PR past its veto window, writes a
# report to docs/seo/reports/, and pushes to main (which deploys).
#
# Lives here rather than in a claude.ai cloud routine because that sandbox blocks
# outbound HTTPS to lawnandlandmarketing.com and api.dataforseo.com (verified
# 2026-09-21), so the snapshot cannot run there at all.
#
# Kill switch: set the repository variable SEO_AGENTS_ENABLED to anything other than
# "true" and every scheduled run exits immediately. Settings > Secrets and variables
# > Actions > Variables.

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Snapshot and report only, make no commits'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kill switch
        id: gate
        env:
          ENABLED: ${{ vars.SEO_AGENTS_ENABLED }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$ENABLED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SEO_AGENTS_ENABLED is not 'true' — skipping this scheduled run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Identify the committer
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "lawn-land-bot"
          git config user.email "web@lawnandlandmarketing.com"

      - name: Run the weekly review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GOOGLE_SEO_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          # Prefer the Claude subscription token (no per-token billing; it draws on
          # Matt's Claude plan). Mint with `claude setup-token` on a machine signed in
          # to the subscription. ANTHROPIC_API_KEY is the pay-per-token fallback and is
          # only used if the OAuth secret is absent.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch
          prompt: |
            You are the standing SEO strategist for lawnandlandmarketing.com (Lawn & Land
            Marketing, a marketing agency working only with green-industry companies; owner
            priority: landscapers, then outdoor living contractors, then land clearing
            companies). You are running inside GitHub Actions in a full checkout of the site
            repo. This is the Monday weekly review. Work end to end.

            READ docs/seo/CHARTER.md FIRST, always. It states who we target, the trade
            priority order that decides every tie, what winning looks like, and which system
            owns what. Nothing you do should contradict it.

            FIRST read, in this order: CLAUDE.md (brand and build rules), docs/seo/STRATEGY.md
            (baseline, diagnosis, guardrails in section 5, the log in section 6), and the two
            newest files in docs/seo/snapshots/.

            THEN:
            1. Run `python3 scripts/seo/snapshot.py`. It reads DATAFORSEO_LOGIN,
               DATAFORSEO_PASSWORD, PAGESPEED_API_KEY, GBP_CLIENT_ID, GBP_CLIENT_SECRET and
               GOOGLE_SEO_REFRESH_TOKEN from the environment. If any are missing or a source
               errors, say exactly which in the report and continue with what does run.
            2. Compare this snapshot with the previous one: Search Console clicks,
               impressions, CTR and position (28 days vs the prior 28), each watch term's
               position, ranked-keyword count, referring domains, PageSpeed, crawl issues.
               Call out pages whose impressions fell more than 30 percent, watch terms that
               dropped 5 or more positions, watch terms that gained, new referring domains
               (flag obvious spam), and any crawl issue.
            3. Fix what is safe and mechanical, directly in the repo: broken internal links;
               posts missing a `seoTitle` (add one, 60 characters or fewer, in _blog.json);
               meta descriptions over 158 characters; posts missing the
               `<p class="article-cta-link">` line in their CTA block; posts in _blog.json but
               missing from sitemap.xml; FAQ markup gen_blog_schema cannot parse. NEVER change
               money-page copy, navigation, design, prices, client facts, DNS, secrets, or
               Google Business Profile. After any change run, and fix anything that fails:
               `python3 gen_blog.py && python3 gen_blog_schema.py && python3 build.py && python3 build.py --check && python3 scripts/check_links.py && python3 scripts/check_structured_data.py && python3 scripts/check_blog_images.py`
            4. Merge article pull requests. `gh` is authenticated via GH_TOKEN. For every open,
               NON-DRAFT PR whose head branch starts with `seo/`, whose title does not start
               with `DRAFT`, and that was opened more than 24 hours ago, merge it:
               `gh pr merge <n> --squash --delete-branch`. A still-open PR means nobody vetoed
               it; a closed PR is a veto, leave it; never merge a draft. Mark anything you
               merged as `done` in docs/seo/CONTENT-QUEUE.md with its date and URL.
            4b. **Competitor Radar health check.** The radar (lawnHQ/competitor-intel) owns
               publishing, and it silently failed for six weeks in Sept 2026 because nobody watched
               it. Using `gh`, count merges to main whose message starts with `radar ` in the last 7
               and 30 days, and list any open `radar/` branches older than 3 days. If there were
               ZERO radar merges in 7 days, say so loudly under "What needs Matt" as a possible
               outage, and name the last radar commit date. This check needs no credentials.
            5. Write docs/seo/reports/<YYYY-MM-DD>.md: a plain-English review under 400 words
               with four headings: Who we are targeting, What moved, What I fixed, What needs
               Matt. No em dashes. "Who we are targeting" is a 3 to 4 line recap drawn from
               docs/seo/CHARTER.md sections 2 and 3: the buyer, the trade priority order, and what
               winning looks like. It exists so Matt re-reads the strategy every week without
               opening another file, and so the next agent is oriented. Then lead the rest with the
               numbers versus last week, and include the AI Overview citation line from the
               snapshot, since AI answers are a top priority. Append one dated line summarizing the
               week to the log in section 6 of docs/seo/STRATEGY.md.
            6. If the environment variable DRY_RUN is "true", stop here and do not commit.
               Otherwise commit everything with the message
               `seo: weekly review <YYYY-MM-DD>` and push to main. Pushing to main deploys
               production, which is expected and safe for docs plus the mechanical fixes above.
               If the push is rejected, rebase on origin/main and try once more.

            RULES: report honestly, a drop is a drop and missing data is missing. Never invent
            a number. Never touch anything outside this repo. One review per run. Finish with a
            summary that stands alone: the headline numbers versus last week, every fix you
            shipped, and the open items for Matt.

      - name: Commit anything left uncommitted
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "seo: weekly review leftovers $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push origin HEAD:main
          else
            echo "Working tree clean."
          fi
